<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(64 74) scale(54)">
      <stop stop-color="#ffb267" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ff8f3c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8f3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(64 84) scale(22)">
      <stop stop-color="#fff4d6"/>
      <stop offset="0.4" stop-color="#ffb35a"/>
      <stop offset="0.62" stop-color="#ec6a1f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e0601a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="thorax" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(64 50) scale(8 14)">
      <stop stop-color="#ffc078" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#ffc078" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc078" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- transparent background; firefly fills the tab, all edges fade out -->
  <g transform="translate(64 66) scale(1.5) translate(-64 -74)">
    <circle cx="64" cy="74" r="54" fill="url(#bloom)"/>
    <ellipse cx="48" cy="58" rx="11" ry="19" transform="rotate(-28.6 48 58)" fill="#ffdcae" opacity="0.4"/>
    <ellipse cx="80" cy="58" rx="11" ry="19" transform="rotate(28.6 80 58)" fill="#ffdcae" opacity="0.4"/>
    <ellipse cx="64" cy="50" rx="8" ry="14" fill="url(#thorax)"/>
    <ellipse cx="64" cy="84" rx="15" ry="20" fill="url(#lantern)"/>
  </g>
</svg>
