<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="night" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(64 77) scale(74)">
      <stop stop-color="#0c0f08"/>
      <stop offset="0.6" stop-color="#060704"/>
      <stop offset="1" stop-color="#020302"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(64 74) scale(54)">
      <stop stop-color="#ffb267" stop-opacity="0.72"/>
      <stop offset="0.35" stop-color="#ff8f3c" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff8f3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(64 84) scale(22)">
      <stop stop-color="#fff4d6"/>
      <stop offset="0.5" stop-color="#ffa64e"/>
      <stop offset="0.82" stop-color="#ec6a1f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ec6a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- night tile -->
  <rect width="128" height="128" rx="26" fill="url(#night)"/>

  <!-- soft bloom -->
  <circle cx="64" cy="74" r="54" fill="url(#bloom)"/>

  <!-- 4 ovals: two wings, upper body, glowing abdomen -->
  <ellipse cx="48" cy="58" rx="11" ry="19" transform="rotate(-28.6 48 58)" fill="#ffe4c2" opacity="0.34"/>
  <ellipse cx="80" cy="58" rx="11" ry="19" transform="rotate(28.6 80 58)" fill="#ffe4c2" opacity="0.34"/>
  <ellipse cx="64" cy="50" rx="8" ry="14" fill="#ffcf92" opacity="0.55"/>
  <ellipse cx="64" cy="84" rx="15" ry="20" fill="url(#lantern)"/>
</svg>
