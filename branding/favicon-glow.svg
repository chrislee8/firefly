<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(32 36) scale(30)">
      <stop stop-color="#ff9a4d" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ff7a2a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="abdomen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(32 40) rotate(90) scale(13 10)">
      <stop stop-color="#ffe0b0"/>
      <stop offset="0.35" stop-color="#ff9d45"/>
      <stop offset="0.8" stop-color="#e5641d"/>
      <stop offset="1" stop-color="#b8480f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wing" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(32 22) scale(12)">
      <stop stop-color="#ffe6c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffcf9e" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="core" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="13" fill="#060507"/>

  <!-- outer bloom -->
  <circle cx="32" cy="36" r="28" fill="url(#halo)" filter="url(#softer)"/>

  <!-- wing lobes (translucent, soft) -->
  <g filter="url(#soft)">
    <ellipse cx="26.5" cy="23" rx="7.5" ry="10.5" fill="url(#wing)" transform="rotate(-17 26.5 23)"/>
    <ellipse cx="37.5" cy="23" rx="7.5" ry="10.5" fill="url(#wing)" transform="rotate(17 37.5 23)"/>
  </g>

  <!-- glowing abdomen -->
  <ellipse cx="32" cy="40" rx="10" ry="13" fill="url(#abdomen)" filter="url(#soft)"/>

  <!-- hot core -->
  <ellipse cx="32" cy="39" rx="4.4" ry="6" fill="#fff0d6" opacity="0.9" filter="url(#core)"/>
</svg>
